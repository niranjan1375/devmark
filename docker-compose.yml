version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devmark-postgres
    environment:
      POSTGRES_USER: devmark
      POSTGRES_PASSWORD: devmark123
      POSTGRES_DB: devmark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmark"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
